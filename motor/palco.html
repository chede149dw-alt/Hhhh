<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="estilo.js"></script>
<script src="rig.js"></script>
<script>
  // Palco genérico: o script Node injeta o personagem e chama desenharFicha().
  window.desenharFicha = function (o) {
    const c = document.getElementById('c');
    c.width = o.largura; c.height = o.altura;
    const ctx = c.getContext('2d');
    ctx.fillStyle = o.fundo || Estilo.fundoFicha;
    ctx.fillRect(0, 0, c.width, c.height);
    const rig = new Rig(window.PERSONAGEM);
    if (o.pose) rig.usarPose(o.pose);
    if (o.expressao) rig.usarExpressao(o.expressao);
    const ySola = o.ySola || (c.height + o.alturaPersonagem) / 2;
    rig.desenhar(ctx, o.x || c.width / 2, ySola, o.alturaPersonagem);
    return c.toDataURL('image/png').split(',')[1];
  };
</script>
</body>
</html>
