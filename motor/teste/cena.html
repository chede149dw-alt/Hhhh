<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
  const W = 1080, H = 1920, FPS = 30, DURACAO = 5;
  const TOTAL = FPS * DURACAO;
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Pseudo-aleatório com semente fixa: mesmo quadro => mesma imagem.
  function rng(seed) {
    return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  }

  function fundo() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1446');
    g.addColorStop(1, '#0a2a4a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function brilho(x, y, raio, cor, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, raio);
    g.addColorStop(0, `rgba(${cor},${alpha})`);
    g.addColorStop(0.35, `rgba(${cor},${alpha * 0.35})`);
    g.addColorStop(1, `rgba(${cor},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, raio, 0, Math.PI * 2);
    ctx.fill();
  }

  function posCirculo(t) {
    const p = easeInOut(clamp(t / DURACAO, 0, 1));
    const x = -200 + p * (W + 400);
    const y = H * 0.5 - 380 + Math.sin(p * Math.PI) * -120;
    return { x, y };
  }

  window.renderFrame = function (n) {
    const t = n / FPS;
    ctx.globalCompositeOperation = 'source-over';
    fundo();

    // Rastro + brilho (mistura aditiva)
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 8; i >= 1; i--) {
      const p = posCirculo(t - i * 0.03);
      brilho(p.x, p.y, 140 - i * 8, '255,190,90', 0.10 * (1 - i / 9));
    }
    const { x, y } = posCirculo(t);
    brilho(x, y, 420, '255,170,60', 0.45);
    brilho(x, y, 200, '255,230,150', 0.6);

    // Faíscas
    const r = rng(n * 7 + 3);
    for (let i = 0; i < 18; i++) {
      const ang = r() * Math.PI * 2, dist = 110 + r() * 160;
      brilho(x - 40 + Math.cos(ang) * dist, y + Math.sin(ang) * dist, 10 + r() * 14, '255,240,200', 0.7 * r());
    }

    // Círculo sólido com sombreado flat
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffcf5a';
    ctx.beginPath(); ctx.arc(x, y, 110, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, 110, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#f2a93b';
    ctx.beginPath(); ctx.arc(x + 45, y + 45, 110, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(x - 40, y - 45, 30, 18, -0.6, 0, Math.PI * 2); ctx.fill();

    // Texto TESTE com entrada em escala e sombra suave
    const entrada = easeInOut(clamp(t / 0.6, 0, 1));
    const pulso = 1 + Math.sin(t * Math.PI * 2) * 0.02;
    ctx.save();
    ctx.translate(W / 2, H / 2 + 120);
    ctx.scale(entrada * pulso, entrada * pulso);
    ctx.globalAlpha = entrada;
    ctx.font = '900 230px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 18;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('TESTE', 0, 0);
    ctx.shadowColor = 'rgba(255,200,100,0.8)';
    ctx.shadowBlur = 60 * clamp(1 - Math.abs(x - W / 2) / 500, 0, 1);
    ctx.shadowOffsetY = 0;
    ctx.fillText('TESTE', 0, 0);
    ctx.restore();
  };

  window.CENA = { W, H, FPS, TOTAL };
</script>
</body>
</html>
