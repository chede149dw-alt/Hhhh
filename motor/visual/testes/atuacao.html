<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste de atuação</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#rot{position:fixed;left:0;right:0;top:60px;text-align:center;font:700 56px/1.15 system-ui,sans-serif;color:#2b2b2b}
</style>
<script type="importmap">{ "imports": { "three": "/motor/visual/lib/three/three.module.js", "three/addons/": "/motor/visual/lib/three/addons/" } }</script>
</head>
<body>
<div id="rot"></div>
<script type="module">
// ?atuacao=larissa_grade&ficha=cliente&vista=34|frente|lado&rotulo=1
import * as THREE from 'three';
import { comoChao, comoObjeto, materialChapado, prepararRenderer, criarLuzes } from '../estilo/chapado.js';
import { criarPos } from '../estilo/posfx.js';
import { criarBoneco, carregarFicha } from '../boneco/boneco.js';
import { criarAnimacao, aplicar } from '../../animacao/animador.js';
import { ATUACOES, chavesDe } from '../../animacao/atuacoes.js';

const q = new URLSearchParams(location.search);
const L = 1080, A = 1920, NOME = q.get('atuacao') || 'larissa_grade', VISTA = q.get('vista') || '34';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(L, A); prepararRenderer(renderer);
document.body.appendChild(renderer.domElement);
const cena = new THREE.Scene(); cena.background = new THREE.Color('#d8d2c6');
const cam = new THREE.PerspectiveCamera(30, L / A, 0.1, 60);
criarLuzes(cena, 'dia', { raioSombra: 3 });
const chao = comoChao(new THREE.Mesh(new THREE.PlaneGeometry(30, 30), materialChapado('#c4bcae', { volume: false })));
chao.rotation.x = -Math.PI / 2; cena.add(chao);
// grade de ferro
const GZ = 0.72, metal = materialChapado('#3b3f46');
const grade = new THREE.Group(); cena.add(grade);
for (let i = -6; i <= 6; i++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 2.3, 8), metal); b.position.set(i * 0.12, 1.15, GZ); grade.add(b); }
for (const y of [0.08, 1.05, 2.25]) { const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 0.03), metal); b.position.set(0, y, GZ); grade.add(b); }
comoObjeto(grade);

const ficha = await carregarFicha(q.get('ficha') || 'cliente');
const b = criarBoneco(ficha); cena.add(b.raiz);
const anim = criarAnimacao(chavesDe(NOME, { medidas: b.medidas }), { medidas: b.medidas });
const pos = criarPos(renderer, L, A, { nevoaMax: 0, desfoqueMax: 0, vinheta: 0.25, grao: 0 });
const CAMS = { '34': [[2.5, 1.35, 2.6], [0, 0.95, 0.35]], frente: [[0, 1.45, 3.4], [0, 1.0, 0.3]], lado: [[3.9, 1.15, 0.5], [0, 0.95, 0.4]], costas34: [[2.2, 1.4, -2.6], [0, 1.0, 0.3]] };
cam.position.set(...CAMS[VISTA][0]); cam.lookAt(...CAMS[VISTA][1]);
const imp = ATUACOES[NOME].impacto;

window.quadro = (t) => {
  aplicar(b, anim.em(t));
  if (q.get('rotulo') !== '0') document.getElementById('rot').textContent = `${NOME} · ${t.toFixed(2)} s${imp !== undefined && Math.abs(t - imp) < 0.009 ? ' · IMPACTO' : ''}`;
  pos.render(cena, cam, t);
};
window.duracao = anim.duracao;
window.pronto = Promise.resolve();
</script>
</body>
</html>
