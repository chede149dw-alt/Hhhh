<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste do cenário</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#rot{position:fixed;left:0;right:0;top:50px;text-align:center;font:700 52px/1.15 system-ui,sans-serif;color:#eee;text-shadow:0 2px 10px #000}
</style>
<script type="importmap">{ "imports": { "three": "/motor/visual/lib/three/three.module.js", "three/addons/": "/motor/visual/lib/three/addons/" } }</script>
</head>
<body>
<div id="rot"></div>
<script type="module">
// Quadro k (use --fps 1) escolhe a vista. Ver VISTAS abaixo.
import * as THREE from 'three';
import { prepararRenderer, criarLuzes } from '../estilo/chapado.js';
import { criarPos } from '../estilo/posfx.js';
import { criarBoneco, carregarFicha } from '../boneco/boneco.js';
import { criarAnimacao, aplicar } from '../../animacao/animador.js';
import { chavesDe, camadasDe, noLugar, estados } from '../../animacao/atuacoes.js';
import { derivar } from '../../animacao/poses.js';
import { olharPara } from '../../animacao/olhar.js';
import { enquadrar, tremor, respiracaoCamera } from '../../animacao/camera.js';
import { criarDistribuidora, MARCAS, PORTINHOLA, GRADE_Z } from '../cenarios/distribuidora.js';
import { criarCelular, segurarNaFrente } from '../objetos/celular.js';

const q = new URLSearchParams(location.search);
const L = 1080, A = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(L, A); prepararRenderer(renderer);
document.body.appendChild(renderer.domElement);
const cena = new THREE.Scene(); cena.background = new THREE.Color('#04050a');
const cam = new THREE.PerspectiveCamera(30, L / A, 0.05, 80);
const cenario = criarDistribuidora(); cena.add(cenario.raiz);
const luzes = criarLuzes(cena, 'interior', { raioSombra: 5.5 });
luzes._base = { sol: luzes.sol.intensity, amb: luzes.ambiente.intensity };
luzes.sol.target.position.set(0, 0, -0.5);

const fichas = Object.fromEntries(await Promise.all(['gabriel', 'cliente', 'eduardo'].map(async (n) => [n, await carregarFicha(n)])));
const gab = criarBoneco(fichas.gabriel), lar = criarBoneco(fichas.cliente), edu = criarBoneco(fichas.eduardo);
cena.add(gab.raiz, lar.raiz, edu.raiz);
const celular = criarCelular({ tipo: 'alerta', texto: 'Cuidado: criaturas estranhas estão entre nós. Imitam vozes de pessoas conhecidas e aparência.' });
cena.add(celular.raiz); celular.raiz.visible = false;
const celGab = criarCelular({ tipo: 'bloqueio' }); gab.juntas.maoD.add(celGab.raiz);
celGab.raiz.position.set(0, -gab.medidas.maoLen * 0.6, gab.medidas.anteL * 0.75); celGab.raiz.rotation.set(0, Math.PI / 2, 0);

// pose final de uma atuação, posta na marca
const poseFinal = (b, nome, marca, t) => {
  const ctx = { medidas: b.medidas };
  const an = criarAnimacao(noLugar(chavesDe(nome, ctx), MARCAS[marca]), { medidas: b.medidas, camadas: camadasDe(nome, ctx), vida: false });
  return an.em(t ?? an.duracao);
};
const P = {
  gabSentado: poseFinal(gab, 'sentado_celular', 'engradado'),
  larGrade: poseFinal(lar, 'larissa_grade', 'portinhola'),
  larParada: poseFinal(lar, 'larissa_grade', 'portinhola', 0.5),
};
const eduBase = (marca) => derivar(estados(edu.medidas).em_pe, { corpo: { x: MARCAS[marca].x, z: MARCAS[marca].z, giro: MARCAS[marca].giro } });
const cabecaDe = (b, pose) => { b.posar(pose); b.raiz.updateMatrixWorld(true); return b.juntas.cabeca.localToWorld(new THREE.Vector3(0, b.medidas.cabecaH * 0.5, 0)).toArray(); };

const posfx = criarPos(renderer, L, A, { ...cenario.pos, focoDist: 2.2, focoFaixa: 1.4, desfoqueMax: 2.5, vinheta: 0.45, grao: 0.03 });
const olho = new THREE.Vector3(), qCab = new THREE.Quaternion(), giro180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
function povDe(b, t, { tremorForca = 0 } = {}) {
  b.raiz.updateMatrixWorld(true); b.juntas.cabeca.visible = false;
  olho.set(0, b.medidas.cabecaH * 0.52, b.medidas.cabecaP * 0.3); b.juntas.cabeca.localToWorld(olho);
  b.juntas.cabeca.getWorldQuaternion(qCab);
  cam.fov = 72; cam.position.copy(olho); cam.quaternion.copy(qCab).multiply(giro180);
  const rp = respiracaoCamera(t), tr = tremor(t, tremorForca);
  cam.position.add(new THREE.Vector3(rp.d[0] + tr.d[0], rp.d[1] + tr.d[1], 0)); cam.rotateZ(rp.rolar + tr.rolar);
  cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
function terceira(enq) {
  edu.juntas.cabeca.visible = true;
  cam.fov = enq.fov; cam.position.set(...enq.pos); cam.lookAt(...enq.alvo); cam.updateProjectionMatrix();
}

const VISTAS = [
  ['visão geral', () => { gab.posar(P.gabSentado); lar.posar(P.larParada); edu.posar(eduBase('balcao')); edu.juntas.cabeca.visible = true; cam.fov = 50; cam.position.set(2.0, 2.65, -2.7); cam.lookAt(-0.6, 0.6, 0.6); cam.updateProjectionMatrix(); return { foco: 3.5 }; }],
  ['1ª pessoa · olhando o Gabriel', (t) => { gab.posar(P.gabSentado); lar.posar(P.larParada); edu.posar(olharPara(eduBase('balcao'), edu.medidas, cabecaDe(gab, P.gabSentado))); gab.posar(P.gabSentado); povDe(edu, t); return { foco: 2.0 }; }],
  ['1ª pessoa · a portinhola', (t) => { gab.posar(P.gabSentado); lar.posar(P.larGrade); edu.posar(olharPara(eduBase('balcao'), edu.medidas, [PORTINHOLA.x, 1.35, GRADE_Z + 0.6])); povDe(edu, t); return { foco: 1.6 }; }],
  ['1ª pessoa · a geladeira', (t) => { gab.posar(P.gabSentado); lar.posar(P.larParada); edu.posar(olharPara(eduBase('geladeira'), edu.medidas, [-1.65, 1.05, 0.2])); povDe(edu, t); return { foco: 0.9 }; }],
  ['1ª pessoa · o alerta', (t) => {
    gab.posar(P.gabSentado); lar.posar(P.larGrade);
    const ctx = { medidas: edu.medidas };
    const an = criarAnimacao(noLugar(chavesDe('segurar_celular', ctx), MARCAS.balcao), { medidas: edu.medidas, vida: false });
    edu.posar(an.em(1.5)); povDe(edu, t); celular.raiz.visible = true; segurarNaFrente(celular, edu.juntas.maoD, cam);
    return { foco: 0.35, faixa: 0.2 };
  }],
  ['1ª pessoa · luz falhando', (t) => { gab.posar(P.gabSentado); lar.posar(derivar(P.larGrade, { rosto: { estranho: 0.8, boca: 'sorriso' } })); edu.posar(olharPara(eduBase('balcao'), edu.medidas, [PORTINHOLA.x, 1.4, GRADE_Z + 0.6])); povDe(edu, t, { tremorForca: 0.01 }); return { foco: 1.6, piscar: true }; }],
  ...['geral', 'medio', 'close'].map((tam) => [`3ª pessoa · ${tam}`, () => {
    const marca = { x: 0.3, z: -1.4, giro: 160, livre: 1.5 };
    gab.posar(derivar(estados(gab.medidas).em_pe, { corpo: { x: marca.x, z: marca.z, giro: marca.giro }, cabeca: { lado: 4 } })); lar.posar(P.larParada); edu.posar(eduBase('balcao'));
    const e = enquadrar({ ator: marca, medidas: gab.medidas, tamanho: tam, angulo: 8, livre: marca.livre, limites: { ...cenario.limites, margem: 0.38 } });
    terceira(e); return { foco: e.dist, faixa: 0.5 };
  }]),
  ['de fora · na grade', () => { gab.posar(P.gabSentado); lar.posar(P.larGrade); edu.posar(eduBase('balcao')); terceira(enquadrar({ ator: { x: PORTINHOLA.x, z: GRADE_Z + 0.9, giro: 0 }, medidas: lar.medidas, tamanho: 'geral', angulo: 28, elevacao: 0.35, fov: 34 })); return { foco: 2.6 }; }],
];

// ---- Sequência (?seq=1, t contínuo): olha o Gabriel → vira para a portinhola → impacto → aproxima → luz falha
const anGab = criarAnimacao(noLugar(chavesDe('sentado_celular', { medidas: gab.medidas }), MARCAS.engradado), { medidas: gab.medidas });
const anLar = criarAnimacao(noLugar(chavesDe('larissa_grade', { medidas: lar.medidas }), MARCAS.portinhola), { medidas: lar.medidas });
const anEdu = criarAnimacao([{ t: 0, pose: eduBase('balcao') }, { t: 10 }], { medidas: edu.medidas });
const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
const T_LAR = 1.0, T_IMPACTO = T_LAR + 1.5;
function sequencia(t) {
  const pg = anGab.em(Math.min(t + 2.0, anGab.duracao)); gab.posar(pg);
  lar.posar(anLar.em(Math.max(0, t - T_LAR)));
  const alvoGab = cabecaDe(gab, pg), alvoPort = [PORTINHOLA.x, 1.32, GRADE_Z + 0.6];
  const k = sm(1.0, 1.75, t);
  const alvo = alvoGab.map((v, i) => v + (alvoPort[i] - v) * k);
  gab.posar(pg);
  edu.posar(olharPara(anEdu.em(t), edu.medidas, alvo));
  const forca = t > T_IMPACTO ? 0.03 * Math.exp(-(t - T_IMPACTO) * 5) : 0;
  povDe(edu, t, { tremorForca: forca });
  cam.fov = 72 - 12 * sm(2.8, 5.2, t); cam.updateProjectionMatrix();
  const piscar = t > 3.9 ? 1 : 0;
  cenario.atualizar(t, { piscar, luzes });
  posfx.definir({ focoDist: k > 0.5 ? 1.5 : 2.1, focoFaixa: 0.8 });
  document.getElementById('rot').textContent = '';
  posfx.render(cena, cam, t);
}

window.quadro = (t) => {
  if (q.get('seq') === '1') return sequencia(t);
  const k = Math.min(VISTAS.length - 1, Math.round(t));
  const [nome, montar] = VISTAS[k];
  celular.raiz.visible = false; edu.juntas.cabeca.visible = true;
  const r = montar(t) || {};
  cenario.atualizar(r.piscar ? 3.3 : t, { piscar: r.piscar ? 1 : 0, luzes });
  if (r.piscar) { luzes.sol.intensity = luzes._base.sol * 0.18; luzes.ambiente.intensity = luzes._base.amb * 0.3; }
  posfx.definir({ focoDist: r.foco ?? 2, focoFaixa: r.faixa ?? 0.8 });
  document.getElementById('rot').textContent = q.get('rotulo') === '0' ? '' : nome;
  posfx.render(cena, cam, t);
};
window.pronto = Promise.resolve();
</script>
</body>
</html>
