<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#F3F1EE}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
  // Folha do personagem 3D (prompt 3): 4 vistas em repouso, 4 rostos (as 4 bocas) e 4 poses.
  // Uso: ficha3d.html?ficha=personagens/lucas/3d/ficha.json  — capturar() devolve a folha em PNG.
  import * as THREE from 'three';
  import { criarLuzes, criarChaoSombra } from './estilo.js';
  import { criarBoneco, POSES, REPOUSO } from '../personagem/boneco.js';

  const arq = new URLSearchParams(location.search).get('ficha') || 'personagens/lucas/3d/ficha.json';
  const ficha = await (await fetch('/' + arq)).json();

  const LW = 2400, FUNDO = '#F3F1EE', CEL = '#FAF9F7', TXT = '#26232C';
  const folha = document.createElement('canvas'); document.body.appendChild(folha);
  const ctx = folha.getContext('2d');

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  const cena = new THREE.Scene(); cena.background = new THREE.Color(CEL);
  const { sol } = criarLuzes(cena, { direcao: [-3, 6, 5], raioSombra: 2 });
  criarChaoSombra(cena, 0.16);
  const boneco = criarBoneco(ficha); cena.add(boneco.raiz);
  // banco para a pose sentar
  const banco = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.36, 0.4), new THREE.MeshToonMaterial({ color: '#B9A58C' }));
  banco.position.set(0, 0.18, -0.08); banco.castShadow = true; cena.add(banco);
  const camera = new THREE.PerspectiveCamera(18, 1, 0.1, 50);

  function celula(x, y, w, h, o) {
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.fov = o.fov || 18; camera.updateProjectionMatrix();
    camera.position.set(...o.cam); camera.lookAt(...o.alvo);
    boneco.posar(o.pose || REPOUSO);
    if (o.rosto) boneco.rosto(o.rosto);
    boneco.raiz.rotation.y = THREE.MathUtils.degToRad(o.giro || 0);
    banco.visible = !!o.banco;
    renderer.render(cena, camera);
    ctx.fillStyle = CEL; roundRect(x, y, w, h + 70, 22);
    ctx.drawImage(renderer.domElement, x, y);
    ctx.fillStyle = TXT; ctx.font = '600 38px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(o.nome, x + w / 2, y + h + 48);
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
  function secao(txt, y) {
    ctx.fillStyle = TXT; ctx.font = '700 52px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(txt, 80, y);
    ctx.fillStyle = '#D5D0CA'; ctx.fillRect(80, y + 18, LW - 160, 3);
  }

  window.quadro = () => {
    const M = 80, G = 30, CW = (LW - 2 * M - 3 * G) / 4;
    const HV = 1000, HR = 560, HP = 1000;
    let y = 0;
    const altura = 300 + (HV + 70) + 140 + (HR + 70) + 140 + (HP + 70) + 200;
    folha.width = LW; folha.height = altura;
    ctx.fillStyle = FUNDO; ctx.fillRect(0, 0, LW, altura);
    ctx.fillStyle = TXT; ctx.textAlign = 'left';
    ctx.font = '800 120px sans-serif'; ctx.fillText(ficha.nome.toUpperCase() + ' 3D', M, 150);
    ctx.font = '500 40px sans-serif'; ctx.fillText(`Altura ${ficha.altura} m · peças: ${ficha.pecas.length} · mesmo design da ficha 2D`, M, 215);
    ctx.fillStyle = '#C8323C'; ctx.font = '700 34px sans-serif'; ctx.fillText((ficha.status || '').toUpperCase(), M, 268);
    // paleta
    const cores = [['Marinho', ficha.cores.moletom], ['Turquesa', ficha.cores.faixa], ['Grafite', ficha.cores.calca], ['Linho', ficha.cores.tenis], ['Pele', ficha.cores.pele], ['Cabelo', ficha.cores.cabelo]];
    cores.forEach(([n, cor], i) => {
      const x = LW - M - (cores.length - i) * 150 + 40;
      ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, 150, 38, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2B2830'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = TXT; ctx.font = '600 24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(n, x, 222);
    });
    y = 300;
    secao('VISTAS', y + 60); y += 110;
    const corpo = { cam: [0, 0.86, 6.4], alvo: [0, 0.82, 0] };
    [['Frente', 0], ['3/4', 40], ['Perfil', 90], ['Costas', 180]].forEach(([nome, giro], i) =>
      celula(M + i * (CW + G), y, CW, HV, { ...corpo, nome, giro }));
    y += HV + 70 + 40;
    secao('ROSTO · 4 BOCAS', y + 60); y += 110;
    const rosto = { cam: [0, 1.42, 2.5], alvo: [0, 1.4, 0], fov: 14 };
    [['Neutro', 'neutro'], ['Feliz', 'feliz'], ['Triste', 'triste'], ['Espanto', 'espanto']].forEach(([nome, r], i) =>
      celula(M + i * (CW + G), y, CW, HR, { ...rosto, nome, rosto: r, giro: 8 }));
    y += HR + 70 + 40;
    secao('POSES', y + 60); y += 110;
    [['Acenar', 'acenar', 10], ['Apontar', 'apontar', 62], ['Sentar', 'sentar', 35], ['Assustado', 'assustado', 15]].forEach(([nome, p, giro], i) =>
      celula(M + i * (CW + G), y, CW, HP, { ...corpo, nome, pose: POSES[p], giro, banco: p === 'sentar' }));
  };
  window.capturar = () => folha.toDataURL('image/png').split(',')[1];
  window.pronto = true;
</script>
</body>
</html>
