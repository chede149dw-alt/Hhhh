<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
  // Cenário + câmera por tamanho de plano (prompt 6).
  //   cena.html?cenario=quarto&modo=folha  → 3 enquadramentos (geral, médio, close) do mesmo personagem
  //   cena.html?cenario=quarto&demo=poder  → vídeo: window.quadro(t) com cortes, movimento de câmera, tremor e efeito
  import * as THREE from 'three';
  import { criarLuzes, criarRenderer, criarPos } from './estilo.js';
  import { criarBoneco } from '../personagem/boneco.js';
  import { criarAnimacao } from '../animacao/animador.js';
  import { aplicar } from '../animacao/aplicar.js';
  import { montarAtuacao, PAUSAS } from '../animacao/atuacoes.js';
  import { CENARIOS } from '../cena/cenarios.js';
  import { enquadrar, camNoTempo } from '../cena/camera.js';
  import { criarPoderTerra, criarRachaduraChao, criarImpactoTerra } from '../efeitos3d/terra.js';

  const q = new URLSearchParams(location.search);
  const nomeCen = q.get('cenario') || 'quarto', folhaModo = q.get('modo') === 'folha', demo = q.get('demo') || 'poder';
  const ficha = await (await fetch('/' + (q.get('ficha') || 'personagens/lucas/3d/ficha.json'))).json();

  const cen = CENARIOS[nomeCen]();
  const cena = new THREE.Scene();
  cena.add(cen.grupo);
  cena.background = cen.fundo;
  cena.fog = new THREE.Fog(...cen.nevoa);
  const { sol } = criarLuzes(cena, { direcao: cen.luz.direcao, raioSombra: cen.luz.raioSombra });
  sol.target.position.set(...cen.luz.alvo);
  sol.position.set(cen.luz.alvo[0] + cen.luz.direcao[0], cen.luz.alvo[1] + cen.luz.direcao[1], cen.luz.alvo[2] + cen.luz.direcao[2]);
  // palco: o personagem fica na marca do cenário
  const palco = new THREE.Group(); palco.position.set(...cen.marca.pos); palco.rotation.y = cen.marca.giro * Math.PI / 180; cena.add(palco);
  const boneco = criarBoneco(ficha); palco.add(boneco.raiz);
  const fx = criarPoderTerra(); cena.add(fx.grupo); fx.grupo.visible = false;
  const racha = criarRachaduraChao(); cena.add(racha.grupo); racha.grupo.visible = false;
  const impacto = criarImpactoTerra(); cena.add(impacto.grupo);
  const camera = new THREE.PerspectiveCamera(30, 9 / 16, 0.05, 120);

  // âncora da câmera: pés e cabeça do personagem (no mundo) — a câmera fica presa ao corpo
  const v = new THREE.Vector3();
  function ancora(pose) {
    aplicar(boneco, pose);
    boneco.raiz.updateMatrixWorld(true);
    const pes = boneco.raiz.getWorldPosition(new THREE.Vector3());
    const cab = boneco.juntas.cabeca.localToWorld(new THREE.Vector3(0, 0.15, 0));
    return { pes: pes.toArray(), cabeca: cab.toArray(), giro: cen.marca.giro + ((pose.corpo && pose.corpo.giro) || 0) };
  }
  const media = (as) => ({ pes: [0, 1, 2].map((i) => as.reduce((s, a) => s + a.pes[i], 0) / as.length),
    cabeca: [0, 1, 2].map((i) => as.reduce((s, a) => s + a.cabeca[i], 0) / as.length), giro: as[1].giro });
  function posicionar(c) {
    camera.position.set(...c.pos); camera.fov = c.fov; camera.updateProjectionMatrix();
    camera.up.set(...(c.cima || [0, 1, 0])); camera.lookAt(...c.alvo); camera.up.set(0, 1, 0);
    if (c.rolagem) camera.rotateZ(c.rolagem * Math.PI / 180);
    // acima do teto (zenital): esconde o que fica pendurado no teto
    for (const m of cen.pecasTeto || []) m.visible = !(cen.teto && c.pos[1] > cen.teto - 0.05);
  }
  // esfera de terra entre as mãos, um pouco à frente
  function efeitoNasMaos(t, prog) {
    // ponto fixo à frente do peito (entre as mãos na pose do poder), acompanhando o giro do tronco
    const c = boneco.juntas.peito.localToWorld(new THREE.Vector3(0, 0.1, 0.42));
    fx.atualizar(t, { prog, centro: c.toArray(), raio: 0.15, camera });
  }

  if (folhaModo) {
    const CW = 600, CH = 1067, M = 40, G = 24;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.setSize(CW, CH);
    const folha = document.createElement('canvas'); document.body.appendChild(folha);
    const ctx = folha.getContext('2d');
    const pose = nomeCen === 'quarto' ? { ...PAUSAS.poder_terra, peEAlvo: [0.17, 0, 0.08], peDAlvo: [-0.16, 0, -0.1], ikPes: 1 }
      : { ...montarAtuacao('acenar').chaves[3].pose };
    window.quadro = () => {
      folha.width = M * 2 + CW * 3 + G * 2; folha.height = 130 + CH + 80;
      ctx.fillStyle = '#F3F1EE'; ctx.fillRect(0, 0, folha.width, folha.height);
      ctx.fillStyle = '#26232C'; ctx.font = '800 60px sans-serif'; ctx.fillText(`Cenário: ${nomeCen}`, M, 85);
      const an = ancora(pose);
      if (nomeCen === 'quarto') { efeitoNasMaos(1.3, 1); racha.atualizar(1, [an.pes[0], an.pes[2] + 0.4], 2.4); }
      [['Geral', 'geral'], ['Médio', 'medio'], ['Close', 'close']].forEach(([nome, tam], i) => {
        const c = enquadrar(tam, an, { lado: 22, areaLivre: cen.areaLivre });
        posicionar(c);
        if (nomeCen === 'quarto') fx.atualizar(1.3, { prog: 1, centro: fx.esfera.position.toArray(), raio: 0.15, camera });
        renderer.render(cena, camera);
        const x = M + i * (CW + G), y = 130;
        ctx.drawImage(renderer.domElement, x, y);
        ctx.fillStyle = '#26232C'; ctx.font = '700 40px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`${nome} · ${c.distancia.toFixed(2)} m · ${c.fov.toFixed(0)}°`, x + CW / 2, y + CH + 55); ctx.textAlign = 'left';
      });
    };
    window.capturar = () => folha.toDataURL('image/png').split(',')[1];
  } else {
    // demos: atuação + lista de planos (cortes) com tamanho, lado e movimento
    const DEMOS = {
      poder: { acao: 'poder_terra', planos: [
        { de: 0, ate: 0.95, tamanho: 'geral', lado: 30, movimento: { tipo: 'empurrar', forca: 0.18 } },
        { de: 0.95, ate: 1.7, tamanho: 'medio', lado: 14, elevacao: 0.0, movimento: { tipo: 'puxar', forca: 0.15 }, tremores: [{ t: 0.25, forca: 0.05, dur: 0.6 }] },
        { de: 1.7, ate: 2.6, tamanho: 'medio', lado: -22, elevacao: -0.05, movimento: { tipo: 'orbita', graus: 20 } } ] },
      andar: { acao: 'andar', opcoes: { passos: 4 }, planos: [
        { de: 0, ate: 1.6, tamanho: 'medio', lado: 55, movimento: { tipo: 'lateral', metros: 0.4 } },
        { de: 1.6, ate: 3.6, tamanho: 'geral', lado: 40, movimento: { tipo: 'empurrar', forca: 0.15 } } ] },
    };
    // linguagem das referências (refs 03, 04, 05): cortes curtos, alturas variadas, objeto em primeiro plano,
    // câmera seguindo a esfera, zenital girando no impacto, deriva sempre ligada, reenquadre na reação
    DEMOS.arremesso = { acao: 'arremesso_terra', planos: [
      { de: 0, ate: 1.2, tamanho: 'geral', lado: 35, angulo: 42, movimento: { tipo: 'empurrar', forca: 0.18 } },
      { de: 1.2, ate: 2.2, tamanho: 'medio', lado: -22, angulo: -14, rolagem: 4, movimento: { tipo: 'empurrar', forca: 0.12 } },
      { de: 2.2, ate: 3.15, primeiroPlano: { distancia: 0.8 }, lado: 32, fov: 40, movimento: { tipo: 'puxar', forca: 0.15 }, reenquadres: [{ t: 0.45, dx: 0.04, dy: 0.02, zoom: 1.06, dur: 0.3 }] },
      { de: 3.15, ate: 3.8, alvo: 'objeto', tamanho: 'detalhe', alturaQuadro: 1.0, lado: 95, angulo: 6, rolagem: -6 },
      { de: 3.8, ate: 4.9, tamanho: 'geral', alturaQuadro: 3.2, angulo: 89, giroRolagem: 22, tremores: [{ t: 0, forca: 0.06, dur: 0.7 }], movimento: { tipo: 'subir', metros: 0.4 } },
      { de: 4.9, ate: 6.0, tamanho: 'close', lado: 18, angulo: -8, movimento: { tipo: 'orbita', graus: 14 }, reenquadres: [{ t: 0.35, dx: -0.03, dy: 0.015, zoom: 1.05, dur: 0.35 }] } ] };
    const d = DEMOS[demo];
    const at = montarAtuacao(d.acao, d.opcoes || {});
    const anim = criarAnimacao(at);
    window.duracao = d.planos[d.planos.length - 1].ate;
    // trajetória da esfera no arremesso: no peito até o lançamento, depois parábola até o chão à frente
    const PONTO_IMPACTO = palco.localToWorld(new THREE.Vector3(0.1, 0.0, 1.35)).toArray();
    let inicioVoo = null;
    function peitoEm(t) { aplicar(boneco, anim.final(t)); boneco.raiz.updateMatrixWorld(true); return boneco.juntas.peito.localToWorld(new THREE.Vector3(0, 0.1, 0.42)).toArray(); }
    function esferaArremesso(t) {
      const ev = at.eventos;
      if (t < ev.lancamento) return peitoEm(t);
      if (!inicioVoo) inicioVoo = peitoEm(ev.lancamento);
      const u = Math.min(1, (t - ev.lancamento) / (ev.impacto - ev.lancamento));
      const p = inicioVoo.map((v, i) => v + (PONTO_IMPACTO[i] + (i === 1 ? 0.12 : 0) - v) * u);
      p[1] += 0.35 * 4 * u * (1 - u);
      return p;
    }
    const W = 1080, H = 1920;
    const renderer = criarRenderer(W, H);
    const pos = criarPos(renderer, W, H);
    window.quadro = (t) => {
      const p = d.planos.find((x) => t >= x.de && t < x.ate) || d.planos[d.planos.length - 1];
      const an = media([ancora(anim.final(t - 0.12)), ancora(anim.final(t)), ancora(anim.final(t + 0.12))]);
      let objeto = null;
      if (d.acao === 'arremesso_terra') objeto = { centro: esferaArremesso(t) };
      aplicar(boneco, anim.final(t));
      const c = camNoTempo(p, { personagem: an, objeto }, t - p.de, p.ate - p.de, cen.areaLivre);
      posicionar(q.get('camlivre') ? { pos: JSON.parse(q.get('camlivre')), alvo: [0, 1.0, 0.2], fov: 40 } : c);
      if (d.acao === 'arremesso_terra') {
        const ev = at.eventos, pe = esferaArremesso(t), prog = (t - ev.forma) / (ev.cheia - ev.forma);
        if (t < ev.impacto) fx.atualizar(t, { prog, centro: pe, raio: 0.15, camera }); else fx.grupo.visible = false;
        impacto.atualizar(t - ev.impacto, PONTO_IMPACTO);
        racha.atualizar((t - ev.impacto) / 0.45, [PONTO_IMPACTO[0], PONTO_IMPACTO[2]], 3.2);
      }
      if (d.acao === 'poder_terra' && at.impacto !== null) {
        const prog = (t - (at.impacto - 0.1)) / 0.6;
        efeitoNasMaos(t, prog);
        racha.atualizar((t - at.impacto) / 0.5, [an.pes[0], an.pes[2] + 0.45], 2.4);
      }
      pos.render(cena, camera, { t, foco: c.foco || c.distancia, faixa: 0.5, desfoque: 14, grao: 0.025, vinheta: 0.32 });
    };
  }
  window.pronto = true;
</script>
</body>
</html>
