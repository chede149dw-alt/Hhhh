<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="icon" href="data:,"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  // Teste das legendas (prompt 9): grupos difíceis (palavras longas, destaque) num quadro 1080×1920.
  // window.medidas = caixas de cada legenda; window.capturar = PNG do quadro.
  import { agrupar, layout, desenhar } from '../legendas/legendas.js';
  await document.fonts.load('900 96px Inter');
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const medir = (txt, tam) => { ctx.font = `900 ${tam}px Inter`; return ctx.measureText(txt).width; };
  const frases = ['INACREDITAVELMENTE EXTRAORDINÁRIO, DESPROPORCIONALMENTE.', 'E ele arremessou tudo no chão!', 'Terra.'];
  const palavras = []; frases.forEach((f, k) => f.split(' ').forEach((w) => palavras.push({ i: palavras.length, texto: w, inicio: palavras.length * 0.3, fim: palavras.length * 0.3 + 0.25, frase: k })));
  const grupos = agrupar(palavras, { destaques: [6, 7] });
  window.quadro = () => {
    const g = ctx.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#8EC3E0'); g.addColorStop(1, '#E9D9C4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
    window.medidas = grupos.map((gr, i) => {
      const lay = layout(gr, medir, { W: 1080, H: 1920, y: 260 + i * 330 });
      desenhar(ctx, lay, gr.inicio + 1, gr);
      return { texto: gr.palavras.map((p) => p.texto).join(' '), x0: lay.x0, x1: lay.x1, y0: lay.y0, y1: lay.y1, tamanho: lay.tamanho };
    });
  };
  window.capturar = () => c.toDataURL('image/png').split(',')[1];
  window.pronto = true;
</script>
</body>
</html>
