<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste de render por quadro</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/motor/visual/lib/three/three.module.js",
               "three/addons/": "/motor/visual/lib/three/addons/" } }
</script>
</head>
<body>
<script type="module">
// Cena de teste: tudo é função de t. Nenhum uso de relógio real nem de Math.random.
import * as THREE from 'three';

const L = 1080, A = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(L, A);
document.body.appendChild(renderer.domElement);

const cena = new THREE.Scene();
cena.background = new THREE.Color('#2b3a55');
const cam = new THREE.PerspectiveCamera(35, L / A, 0.1, 100);
cam.position.set(0, 1.5, 11);
cam.lookAt(0, 0.6, 0);

cena.add(new THREE.AmbientLight('#ffffff', 1.2));
const sol = new THREE.DirectionalLight('#ffffff', 2.0);
sol.position.set(3, 5, 4);
cena.add(sol);

const chao = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: '#7aa36b' }));
chao.rotation.x = -Math.PI / 2;
cena.add(chao);

const cubo = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: '#e8604c' }));
const bola = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), new THREE.MeshLambertMaterial({ color: '#f2c14e' }));
cena.add(cubo, bola);

window.quadro = (t) => {
  cubo.position.set(-0.8, 0.5 + Math.abs(Math.sin(t * 3)) * 1.2, 0);
  cubo.rotation.set(t * 0.7, t * 1.3, 0);
  bola.position.set(0.8 + Math.cos(t * 2) * 0.3, 0.5, Math.sin(t * 2) * 0.3);
  renderer.render(cena, cam);
};
window.pronto = Promise.resolve();
</script>
</body>
</html>
